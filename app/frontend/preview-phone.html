<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAFI — پیش‌نمایش موبایل</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0a10;
      --frame: #1a1520;
      --gold: #d4af37;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, #2a1830 0%, transparent 55%),
        var(--bg);
      color: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: 0.85rem;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      color: var(--gold);
    }
    .sub { margin: 0; font-size: 0.82rem; color: var(--muted); text-align: center; max-width: 420px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      max-width: 520px;
    }
    button, a.btn {
      appearance: none;
      border: 1px solid rgba(212,175,55,0.35);
      background: rgba(0,0,0,0.35);
      color: var(--gold);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    button.active, a.btn:hover { background: rgba(212,175,55,0.15); }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .phone {
      position: relative;
      width: var(--phone-w, 390px);
      height: var(--phone-h, 844px);
      max-height: min(844px, calc(100dvh - 9rem));
      background: #000;
      border-radius: 36px;
      border: 3px solid #2a2433;
      box-shadow:
        0 0 0 2px #111,
        0 24px 60px rgba(0,0,0,0.55),
        inset 0 0 0 1px rgba(212,175,55,0.15);
      overflow: hidden;
      transition: width 0.25s ease, height 0.25s ease;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 28%;
      height: 18px;
      background: #0a0a0c;
      border-radius: 999px;
      z-index: 3;
      pointer-events: none;
    }
    .phone iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #07070c;
    }
    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    code { color: #e8d5a3; }
  </style>
</head>
<body>
  <h1>MAFI · MOBILE PREVIEW</h1>
  <p class="sub">شبیه‌ساز گوشی در مرورگر — قبل از پچ APK، UI و لابی و QR را مثل موبایل چک کن.</p>
  <div class="toolbar" id="toolbar">
    <button type="button" data-w="390" data-h="844" class="active">iPhone 14</button>
    <button type="button" data-w="360" data-h="800">Android</button>
    <button type="button" data-w="430" data-h="932">Pro Max</button>
    <button type="button" data-w="412" data-h="915">Pixel</button>
    <button type="button" id="btn-game">بازی</button>
    <button type="button" id="btn-boot">صفحه بوت APK</button>
    <button type="button" id="btn-reload">رفرش</button>
    <a class="btn" href="/" target="_blank" rel="noopener">باز کردن تمام‌صفحه</a>
  </div>
  <div class="stage">
    <div class="phone" id="phone">
      <iframe id="frame" title="MAFI mobile" src="/?preview=1&v=29" allow="microphone; autoplay; clipboard-read; clipboard-write"></iframe>
    </div>
  </div>
  <p class="hint">بعد از OK شدن UI: <code>Mobile APP\fast-patch-apk.bat</code> را بزن — معمولاً چند ثانیه.</p>
  <script>
    const phone = document.getElementById("phone");
    const frame = document.getElementById("frame");
    const toolbar = document.getElementById("toolbar");
    toolbar.querySelectorAll("button[data-w]").forEach((btn) => {
      btn.addEventListener("click", () => {
        toolbar.querySelectorAll("button[data-w]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        phone.style.setProperty("--phone-w", btn.dataset.w + "px");
        phone.style.setProperty("--phone-h", btn.dataset.h + "px");
      });
    });
    document.getElementById("btn-game").onclick = () => {
      frame.src = "/?preview=1&v=" + Date.now();
    };
    document.getElementById("btn-boot").onclick = () => {
      // Served from backend static mirror of Capacitor www boot UI
      frame.src = "/apk-boot/?t=" + Date.now();
    };
    document.getElementById("btn-reload").onclick = () => {
      frame.src = frame.src.split("#")[0].replace(/([?&])t=\d+/, "$1t=" + Date.now());
      if (!/[?&]t=/.test(frame.src)) {
        frame.src += (frame.src.includes("?") ? "&" : "?") + "t=" + Date.now();
      }
    };
  </script>
</body>
</html>
